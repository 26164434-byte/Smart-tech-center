<main class="container">
<section class="form-card">
<h1>إنشاء حساب جديد</h1>
<form id="registerForm">
<label for="registerName">الاسم</label><input type="text" id="registerName" required>
<label for="registerEmail">البريد الإلكتروني</label><input type="email" id="registerEmail" required>
<label for="registerPassword">كلمة المرور</label><input type="password" id="registerPassword" required>
<label for="confirmPassword">تأكيد كلمة المرور</label><input type="password" id="confirmPassword" required>
<div id="registerPasswordError" class="error"></div>
<button type="submit" class="btn btn-primary">إنشاء الحساب</button>
</form>
</section>
</main>
<div class="toast-container position-fixed bottom-0 start-0 p-3">
<div id="registerToast" class="toast"><div class="toast-header"><strong class="me-auto">إنشاء الحساب</strong><button class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">تم إنشاء الحساب تجريبيًا بنجاح.</div></div>
</div>
