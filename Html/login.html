<main class="container">
<section class="form-card">
<h1>تسجيل الدخول</h1>
<p>أدخل بياناتك للوصول إلى حسابك.</p>
<form id="loginForm">
<label for="loginEmail">البريد الإلكتروني</label>
<input type="email" id="loginEmail" placeholder="name@example.com" required>
<div id="loginEmailError" class="error"></div>
<label for="loginPassword">كلمة المرور</label>
<input type="password" id="loginPassword" required>
<div id="loginPasswordError" class="error"></div>
<button type="submit" class="btn btn-primary">دخول</button>
</form>
</section>
</main>
<div class="toast-container position-fixed bottom-0 start-0 p-3">
<div id="loginToast" class="toast"><div class="toast-header"><strong class="me-auto">تسجيل الدخول</strong><button class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">تم التحقق من البيانات بنجاح.</div></div>
</div>
