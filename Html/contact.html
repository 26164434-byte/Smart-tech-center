<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title><link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header><div class="header-inner"><div class="logo">مركز <span>التقنية الذكية</span></div><p>تواصل معنا</p></div></header>

<nav>
<a href="index.html">الرئيسية</a>
<a href="about.html">من نحن</a>
<a href="services.html">خدماتنا</a>

<a href="register.html">إنشاء حساب</a>

</nav>

<main class="container">
<section class="form-card">
<h1>تواصل معنا</h1>
<p>يسعدنا استقبال استفسارك ورسالتك.</p>
<form id="contactForm">
<label for="contactName">الاسم</label><input type="text" id="contactName" required>
<label for="contactEmail">البريد الإلكتروني</label><input type="email" id="contactEmail" required>
<label for="contactMessage">الرسالة</label><textarea id="contactMessage" rows="6" required></textarea>
<button type="submit" class="btn btn-primary">إرسال الرسالة</button>
</form>
<div class="social">
<a href="#" aria-label="فيسبوك"><i class="fa-brands fa-facebook"></i></a>
<a href="#" aria-label="إنستغرام"><i class="fa-brands fa-instagram"></i></a>
<a href="#" aria-label="إكس"><i class="fa-brands fa-x-twitter"></i></a>
<a href="#" aria-label="يوتيوب"><i class="fa-brands fa-youtube"></i></a>
</div>
</section>

<section class="card mt-4">
<h2>تعرف على المركز</h2>
<video class="video-box" controls poster="../images/hero1.svg">
<source src="../video/intro.mp4" type="video/mp4">
المتصفح لا يدعم تشغيل الفيديو.
</video>
<p class="notice mt-3">الفيديو التعريفي موجود داخل مجلد videos.</p>
</section>
</main>

<div class="toast-container position-fixed bottom-0 start-0 p-3">
<div id="contactToast" class="toast"><div class="toast-header"><strong class="me-auto">رسالة تأكيد</strong><button class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">شكرًا لك! تم استلام رسالتك بنجاح.</div></div>
</div>
<footer><p>© 2026 مركز التقنية الذكية</p></footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
